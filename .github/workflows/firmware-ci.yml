name: Firmware CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'audit/**'
      - 'fix/**'
      - 'diagnostics/**'

permissions:
  contents: read

concurrency:
  group: firmware-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Regression tests and Sprut-compatible firmware
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build Sprut.Hub-compatible firmware (mandatory pre-start TCLK patch)
        run: python scripts/build_spruthub.py
      - name: Upload firmware and provenance manifest
        uses: actions/upload-artifact@v4
        with:
          name: doobsky-spruthub-firmware
          path: |
            .pio/build/esp32-h2-supermini-end-device/firmware.bin
            build/firmware-manifest.json
          if-no-files-found: error
