[platformio]
default_envs = esp32-h2-zigbee3-strict

[env:esp32-h2-supermini-end-device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-h2-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = zigbee.csv
extra_scripts = pre:scripts/require_sprut_build.py
build_unflags =
    -Os
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -D ZIGBEE_MODE_ED
    -D SPRUT_TC_COMPAT_MODE
    -O2

; Explicit opt-out profile for coordinator comparisons only.
; Never flash it on the paired Sprut.Hub device: it has NO TCLK workaround.
[env:esp32-h2-zigbee3-strict]
extends = env:esp32-h2-supermini-end-device
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -D ZIGBEE_MODE_ED
    -D ZIGBEE3_STRICT_SECURITY
    -O2
