[platformio]
default_envs = esp32-h2-zigbee3-strict

[env:esp32-h2-sprut-compat]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-h2-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = zigbee.csv
extra_scripts = pre:scripts/require_profile_build.py
build_unflags =
    -Os
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -D ZIGBEE_MODE_ED
    -D SPRUT_TC_COMPAT_MODE
    -O2

; Strict Zigbee 3.0 Trust Center security profile (default for conformance tests).
; Never flash it onto an already-paired Sprut.Hub node without testing.
[env:esp32-h2-zigbee3-strict]
extends = env:esp32-h2-sprut-compat
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -D ZIGBEE_MODE_ED
    -D ZIGBEE3_STRICT_SECURITY
    -O2
